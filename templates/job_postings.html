<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktif İş İlanları - Alumni Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome İkonları -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; padding: 40px 0; border-radius: 0 0 20px 20px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .table th { background-color: #212529; color: white; font-weight: 600; padding: 15px; }
        .table td { padding: 15px; vertical-align: middle; }
        .search-box { max-width: 400px; }
    </style>
</head>
<body>

    <!-- Üst Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-graduation-cap me-2 text-info"></i>Alumni Portal</a>
            <div class="d-flex">
                <a href="/api/swagger" target="_blank" class="btn btn-outline-light btn-sm"><i class="fas fa-code me-1"></i> API Swagger</a>
            </div>
        </div>
    </nav>

    <!-- Hero Başlık Alanı -->
    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold"><i class="fas fa-briefcase me-2"></i>Mezun Kariyer & İş İlanları</h1>
            <p class="lead mt-2">Mezunlar arası paylaşılan en güncel iş ve staj fırsatlarını keşfedin.</p>
        </div>
    </div>

    <!-- Ana İçerik ve Tablo -->
    <div class="container mb-5">
        <div class="row mb-3 align-items-center">
            <div class="col-md-6">
                <h4 class="text-secondary fw-semibold">Yayındaki İlanlar</h4>
            </div>
            <div class="col-md-6 text-md-end">
                <input type="text" id="searchInput" class="form-control search-box d-inline-block" placeholder="🔍 İlan veya şirket ara...">
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="jobTable">
                        <thead>
                            <tr>
                                <th>#ID</th>
                                <th>Pozisyon / Açıklama</th>
                                <th>Şirket</th>
                                <th>Lokasyon</th>
                                <th>İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="jobTableBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">Yükleniyor...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript ile Dinamik Veri Çekme ve Filtreleme -->
    <script>
        let allJobs = [];

        fetch('/api/job-postings')
            .then(res => res.json())
            .then(data => {
                allJobs = data;
                renderTable(allJobs);
            })
            .catch(err => {
                document.getElementById('jobTableBody').innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Veriler yüklenirken hata oluştu.</td></tr>`;
            });

        function renderTable(jobs) {
            const tbody = document.getElementById('jobTableBody');
            if (jobs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Henüz kayıtlı iş ilanı bulunmuyor.</td></tr>`;
                return;
            }
            tbody.innerHTML = '';
            jobs.forEach(job => {
                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge bg-secondary">#${job.id}</span></td>
                        <td>
                            <div class="fw-bold text-dark">${job.title}</div>
                            <small class="text-muted">${job.description ? job.description.substring(0, 65) + '...' : 'Açıklama yok'}</small>
                        </td>
                        <td><span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2">${job.company}</span></td>
                        <td><i class="fas fa-map-marker-alt text-danger me-1"></i>${job.city || 'Belirtilmemiş'}</td>
                        <td>
                            <a href="/api/swagger" class="btn btn-sm btn-outline-primary"><i class="fas fa-eye"></i> Detay</a>
                        </td>
                    </tr>
                `;
            });
        }

        // Arama Filtresi
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = allJobs.filter(job => 
                job.title.toLowerCase().includes(term) || job.company.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });
    </script>
</body>
</html>
