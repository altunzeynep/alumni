<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İş İlanları - Alumni Tracking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap me-2"></i>Alumni Portal | İş İlanları</a>
            <a href="/api/swagger" target="_blank" class="btn btn-outline-light btn-sm">API Swagger</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h2><i class="fas fa-briefcase text-primary me-2"></i>Aktif İş İlanları</h2>
                <p class="text-muted">Mezunlar arası paylaşılan kariyer ve staj fırsatları.</p>
            </div>
            <div class="col-auto">
                <a href="/ui/applications" class="btn btn-primary">Başvuruları Görüntüle</a>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Pozisyon</th>
                                <th>Şirket</th>
                                <th>Lokasyon</th>
                                <th>İletişim</th>
                                <th>İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="jobTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">Yükleniyor...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/job-postings')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('jobTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">Henüz ilan bulunmuyor.</td></tr>`;
                    return;
                }
                tbody.innerHTML = '';
                data.forEach(job => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>#${job.id}</strong></td>
                            <td><span class="fw-bold text-dark">${job.title}</span><br><small class="text-muted">${job.description ? job.description.substring(0, 50) : ''}...</small></td>
                            <td><span class="badge bg-secondary">${job.company}</span></td>
                            <td>${job.location || 'Belirtilmemiş'}</td>
                            <td><code>${job.contact_email}</code></td>
                            <td>
                                <a href="/api/job-postings/${job.id}/applications" target="_blank" class="btn btn-sm btn-outline-info">Başvurular</a>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('jobTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">Veriler yüklenirken hata oluştu.</td></tr>`;
            });
    </script>
</body>
</html>
