<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Başvurular - Alumni Tracking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap me-2"></i>Alumni Portal | Başvurular</a>
            <a href="/ui/job-postings" class="btn btn-outline-light btn-sm">İlanlara Dön</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h2><i class="fas fa-clipboard-list text-success me-2"></i>İş Başvuruları Takibi</h2>
                <p class="text-muted">Mezunların ilanlara yaptığı başvuruların yönetildiği panel.</p>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Başvuru ID</th>
                                <th>İlan ID</th>
                                <th>Mezun ID</th>
                                <th>Durum</th>
                                <th>Başvuru Tarihi</th>
                            </tr>
                        </thead>
                        <tbody id="appTableBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">Yükleniyor...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/applications')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('appTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Henüz başvuru bulunmuyor.</td></tr>`;
                    return;
                }
                tbody.innerHTML = '';
                data.forEach(app => {
                    let badgeClass = 'bg-warning text-dark';
                    if (app.status === 'Accepted') badgeClass = 'bg-success';
                    if (app.status === 'Rejected') badgeClass = 'bg-danger';

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>#${app.id}</strong></td>
                            <td>İlan #${app.job_posting_id}</td>
                            <td>Mezun #${app.graduate_id}</td>
                            <td><span class="badge ${badgeClass}">${app.status}</span></td>
                            <td>${new Date(app.created_at).toLocaleString('tr-TR')}</td>
                        </tr>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('appTableBody').innerHTML = `<tr><td colspan="5" class="text-center text-danger">Veriler yüklenirken hata oluştu.</td></tr>`;
            });
    </script>
</body>
</html>
