services:
  postgres:
    image: postgres:16-alpine
    container_name: alumni_postgres_node
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alumni_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: alumni_core_api
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace  # Yerel kodunun konteynere anında yansımasını sağlar
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@alumni_postgres_node:5432/alumni_db
    depends_on:
      - postgres

volumes:
  postgres_data: